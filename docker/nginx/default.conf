# Nginx milik aplikasi RT (di dalam container). Di VPS, Nginx host menangani TLS lalu meneruskan ke sini.

# Teruskan protokol asli (https) dari Nginx host; jika diakses langsung, pakai skema sendiri
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 10M;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;

    location /api/   { proxy_pass http://api:8000; }
    location /admin/ { proxy_pass http://api:8000; }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # File privat (bukti bayar): hanya bisa dicapai lewat X-Accel-Redirect dari Django
    location /protected-media/ {
        internal;
        alias /app/media/;
        add_header Cache-Control "private, no-store";
    }

    # Aset hasil build punya hash di nama file -> aman di-cache lama
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker & halaman utama tidak boleh di-cache agar update PWA langsung terpakai
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /sw.js      { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # SPA/PWA: semua route lain ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
