<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>RT Kita — Prototipe</title>
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface-2:#eef2f1; --text:#16201d; --muted:#5d6b67; --line:#dde4e2;
  --primary:#0f766e; --primary-ink:#ffffff; --primary-soft:#d7efec;
  --ok:#15803d; --ok-soft:#dcf3e3; --warn:#b45309; --warn-soft:#fbeed8; --bad:#b91c1c; --bad-soft:#fbe1e1;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1413; --surface:#151d1b; --surface-2:#1c2725; --text:#e6eeec; --muted:#93a39f; --line:#26332f;
    --primary:#2dd4bf; --primary-ink:#06201c; --primary-soft:#123b36;
    --ok:#4ade80; --ok-soft:#133222; --warn:#fbbf24; --warn-soft:#3a2d12; --bad:#f87171; --bad-soft:#3d1a1a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1413; --surface:#151d1b; --surface-2:#1c2725; --text:#e6eeec; --muted:#93a39f; --line:#26332f;
  --primary:#2dd4bf; --primary-ink:#06201c; --primary-soft:#123b36;
  --ok:#4ade80; --ok-soft:#133222; --warn:#fbbf24; --warn-soft:#3a2d12; --bad:#f87171; --bad-soft:#3d1a1a;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.app{min-height:100vh;display:flex}
/* Sidebar (desktop) */
.side{width:240px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:0 8px 16px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:800}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--muted);text-align:left}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-btn svg{width:20px;height:20px;flex:none}
.side .spacer{flex:1}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;flex:1}
.top .m-brand{display:none}
.content{padding:24px 28px 40px;max-width:1100px;width:100%}
.role{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.role select{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
/* Bottom nav (mobile) */
.bottom{display:none}
/* Components */
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:2fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 12px;font-size:15px}
.stat .v{font-size:26px;font-weight:700;margin-top:2px}
.stat .l{color:var(--muted);font-size:13px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.list>*+*{border-top:1px solid var(--line)}
.item{padding:12px 0;display:flex;gap:12px;align-items:center}
.item .grow{flex:1;min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-warn{background:var(--warn-soft);color:var(--warn)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-pri{background:var(--primary-soft);color:var(--primary)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.okb{color:var(--ok)} .btn.badb{color:var(--bad)}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
label.f{display:block;margin-bottom:12px} label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.tab{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;font-size:14px}
.tab.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--surface-2)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.matrix th,.matrix td{text-align:center;padding:8px 6px}
.matrix td:first-child,.matrix th:first-child{text-align:left;position:sticky;left:0;background:var(--surface);min-width:130px}
.dot{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-size:12px;font-weight:700}
.d-ok{background:var(--ok-soft);color:var(--ok)} .d-warn{background:var(--warn-soft);color:var(--warn)} .d-bad{background:var(--bad-soft);color:var(--bad)}
.cards-m{display:none}
.post{display:flex;gap:14px}
.thumb{width:84px;height:84px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:30px}
.hero{background:linear-gradient(135deg,var(--primary),#0e7490);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.8)}
.fab{display:none}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;flex:none}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer}
.drop:hover{border-color:var(--primary);color:var(--primary)}
.chk{display:flex;flex-wrap:wrap;gap:8px}
.chk label{border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;gap:6px;align-items:center;cursor:pointer;font-size:14px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:20px}
.sheet h2{margin:0 0 14px;font-size:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:60;font-size:14px;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== Mobile ===== */
@media (max-width:767px){
  .side{display:none}
  .top{padding:12px 16px}
  .top h1{display:none}
  .top .m-brand{display:flex;flex:1;align-items:center;gap:10px;font-weight:700}
  .role span{display:none}
  .content{padding:16px 16px 96px}
  .g4{grid-template-columns:1fr 1fr} .g2{grid-template-columns:1fr}
  .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
  .bottom .nav-btn{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;align-items:center;text-align:center;background:none}
  .bottom .nav-btn.on{background:none}
  .bottom .nav-btn.on svg{background:var(--primary-soft);border-radius:99px;padding:3px 14px;width:52px;height:28px;box-sizing:border-box}
  .table-d{display:none} .cards-m{display:block}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:84px;width:56px;height:56px;border-radius:18px;background:var(--primary);color:var(--primary-ink);border:0;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:9;cursor:pointer}
  .hide-m{display:none}
  .modal{align-items:flex-end;padding:0}
  .sheet{border-radius:20px 20px 0 0;max-height:92vh}
  .thumb{width:64px;height:64px;font-size:24px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">RT</div>RT 05 / RW 03</div>
    <nav id="sideNav"></nav>
    <div class="spacer"></div>
    <div class="small muted" style="padding:0 8px">Prototipe desain · data contoh</div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="m-brand"><div class="logo">RT</div>RT 05</div>
      <h1 id="title">Beranda</h1>
      <label class="role"><span>Lihat sebagai</span>
        <select id="role">
          <option value="pengurus">Pengurus</option>
          <option value="warga">Warga</option>
          <option value="admin">Admin</option>
        </select>
      </label>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<nav class="bottom" id="bottomNav"></nav>
<button class="fab" id="fab" aria-label="Tambah">+</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>',
  me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="11" r="2.5"/><path d="M5.5 17a3.5 3.5 0 0 1 7 0M15 10h3M15 14h3"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13v4"/><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="16.5" cy="13.5" r="1.2"/></svg>',
  news:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14a2 2 0 0 0 2 2H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v10a2 2 0 0 1-2 2M8 9h5M8 13h5M8 17h3"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0 1.2 2.9h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
};

/* ---------- Data contoh ---------- */
const MONTHS = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov'];
const FEE = 60000;
const KK = [
  {id:1, head:'Budi Santoso', block:'A', no:'1', occ:'Pemilik', phone:'0812•••4410', members:[['Budi Santoso','Kepala Keluarga','L',44],['Sri Wahyuni','Istri','P',41],['Dimas Santoso','Anak','L',15],['Laras Santoso','Anak','P',10]]},
  {id:2, head:'Ahmad Fauzi', block:'A', no:'2', occ:'Pemilik', phone:'0813•••2231', members:[['Ahmad Fauzi','Kepala Keluarga','L',52],['Nur Aini','Istri','P',49],['Rizki Fauzi','Anak','L',22]]},
  {id:3, head:'Yohanes Situmorang', block:'A', no:'3', occ:'Kontrak', phone:'0821•••9087', members:[['Yohanes Situmorang','Kepala Keluarga','L',33],['Maria Simanjuntak','Istri','P',30],['Grace Situmorang','Anak','P',3]]},
  {id:4, head:'Dewi Lestari', block:'B', no:'1', occ:'Pemilik', phone:'0857•••1123', members:[['Dewi Lestari','Kepala Keluarga','P',58],['Agus Pratama','Anak','L',29]]},
  {id:5, head:'Hendra Wijaya', block:'B', no:'2', occ:'Pemilik', phone:'0811•••6620', members:[['Hendra Wijaya','Kepala Keluarga','L',47],['Lina Wijaya','Istri','P',45],['Kevin Wijaya','Anak','L',19],['Cindy Wijaya','Anak','P',16]]},
  {id:6, head:'Slamet Riyadi', block:'B', no:'3', occ:'Kos', phone:'0896•••3301', members:[['Slamet Riyadi','Kepala Keluarga','L',27]]},
  {id:7, head:'Ketut Arsana', block:'C', no:'1', occ:'Pemilik', phone:'0819•••7745', members:[['Ketut Arsana','Kepala Keluarga','L',39],['Made Sari','Istri','P',36],['Putu Arsana','Anak','L',8]]},
  {id:8, head:'Rina Marlina', block:'C', no:'2', occ:'Kontrak', phone:'0822•••5512', members:[['Rina Marlina','Kepala Keluarga','P',35],['Fajar Nugroho','Suami','L',37],['Alya Nugroho','Anak','P',6],['Bima Nugroho','Anak','L',2]]},
];
// status: 2 lunas, 1 menunggu verifikasi, 0 belum
const PAY = {
  1:[2,2,2,2,2,2,2,2,2,2,0], 2:[2,2,2,2,2,2,2,2,2,2,2], 3:[2,2,2,0,0,2,2,2,2,1,1],
  4:[2,2,2,2,2,2,2,2,2,2,2], 5:[2,2,2,2,2,2,2,2,2,2,1], 6:[2,2,0,0,0,0,2,2,0,0,0],
  7:[2,2,2,2,2,2,2,2,2,2,2], 8:[2,2,2,2,2,2,2,2,2,0,0],
};
const PROOFS = [
  {id:1, kk:3, months:[9,10], amount:120000, date:'20 Nov 2026', bank:'Transfer BRI'},
  {id:2, kk:5, months:[10], amount:60000, date:'19 Nov 2026', bank:'QRIS'},
];
const POSTS = [
  {type:'kegiatan', title:'Kerja Bakti Bersih Selokan', date:'Minggu, 29 Nov 2026 · 07.00', place:'Kumpul di Pos Ronda Blok A', emoji:'🧹', body:'Mohon setiap KK mengirim minimal 1 perwakilan dan membawa cangkul/sapu. Konsumsi disediakan dari kas RT.', pinned:true},
  {type:'berita', title:'Iuran Bulan Desember Naik Rp5.000 untuk Kas Banjir', date:'18 Nov 2026', emoji:'📢', body:'Berdasarkan rapat warga 15 November, iuran kas sosial bertambah Rp5.000 mulai Desember untuk persiapan musim hujan.'},
  {type:'kegiatan', title:'Posyandu Balita & Lansia', date:'Rabu, 3 Des 2026 · 08.00', place:'Rumah Ibu Dewi (B-1)', emoji:'🩺', body:'Penimbangan, imunisasi, dan cek tensi gratis untuk lansia.'},
  {type:'berita', title:'Jadwal Ronda Bulan Desember', date:'15 Nov 2026', emoji:'🔦', body:'Jadwal ronda terbaru sudah ditempel di pos ronda. Silakan cek nama Anda.'},
];
const ME = 1; // akun warga yang sedang login: KK Budi Santoso

/* ---------- State & helpers ---------- */
const S = { role:'pengurus', page:'home', iuranTab:'rekap', kkPick:1, q:'' };
const $ = s => document.querySelector(s);
const rp = n => 'Rp' + n.toLocaleString('id-ID');
const ini = n => n.split(' ').map(w=>w[0]).slice(0,2).join('');
const isStaff = () => S.role !== 'warga';
const STAT = {2:['d-ok','✓','Lunas','b-ok'],1:['d-warn','⏳','Menunggu','b-warn'],0:['d-bad','✕','Belum','b-bad']};
const kk = id => KK.find(k=>k.id===id);
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); };
const openModal = html => { $('#sheet').innerHTML = html; $('#modal').classList.add('open'); };
const closeModal = () => $('#modal').classList.remove('open');
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });

function navItems(){
  const n = [['home','Beranda',I.home]];
  if (isStaff()) n.push(['warga','Data Warga',I.users]);
  n.push(['saya','Data Saya',I.me]);
  n.push(['iuran','Iuran',I.wallet]);
  n.push(['berita','Berita',I.news]);
  if (S.role==='admin') n.push(['atur','Pengaturan',I.gear]);
  return n;
}
function renderNav(){
  const items = navItems();
  if (!items.find(i=>i[0]===S.page)) S.page='home';
  const b = (i) => `<button class="nav-btn ${S.page===i[0]?'on':''}" data-go="${i[0]}">${i[2]}<span>${i[1]}</span></button>`;
  $('#sideNav').innerHTML = items.map(b).join('');
  // Navigasi bawah HP maksimal 5 ikon
  $('#bottomNav').innerHTML = items.filter(i=>i[0]!=='atur').slice(0,5).map(b).join('');
  $('#title').textContent = items.find(i=>i[0]===S.page)[1];
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g){ S.page=g.dataset.go; render(); window.scrollTo(0,0); }
  const t = e.target.closest('[data-tab]'); if (t){ S.iuranTab=t.dataset.tab; render(); }
  const a = e.target.closest('[data-act]'); if (a) ACT[a.dataset.act](a.dataset.id);
});
$('#role').addEventListener('change', e => { S.role=e.target.value; S.iuranTab='rekap'; render(); });

/* ---------- Halaman ---------- */
function pageHome(){
  const nowIdx = MONTHS.length-1;
  if (!isStaff()){
    const st = PAY[ME][nowIdx], arrears = PAY[ME].filter(s=>s===0).length;
    return `
    <div class="card hero" style="margin-bottom:16px">
      <div class="muted small">Selamat datang,</div>
      <div style="font-size:20px;font-weight:700">${kk(ME).head}</div>
      <div class="muted small">Blok ${kk(ME).block} No. ${kk(ME).no}</div>
    </div>
    <div class="grid g2">
      <div class="card">
        <h3>Iuran ${MONTHS[nowIdx]} 2026</h3>
        <div class="row between"><div><div style="font-size:24px;font-weight:700">${rp(FEE)}</div>
        <div class="small muted">Kebersihan + Keamanan + Kas Sosial</div></div>
        <span class="badge ${STAT[st][3]}">${STAT[st][2]}</span></div>
        ${arrears?`<p class="small" style="color:var(--bad)">Tunggakan: ${arrears} bulan (${rp(arrears*FEE)})</p>`:''}
        <div class="row" style="margin-top:12px;gap:8px"><button class="btn pri" data-act="upload">Unggah bukti bayar</button><button class="btn" data-go="iuran">Riwayat</button></div>
      </div>
      <div class="card"><h3>Kegiatan mendatang</h3><div class="list">
        ${POSTS.filter(p=>p.type==='kegiatan').map(p=>`<div class="item"><div style="font-size:22px">${p.emoji}</div><div class="grow"><b>${p.title}</b><div class="small muted">${p.date}</div></div></div>`).join('')}
      </div></div>
    </div>
    <div class="card" style="margin-top:16px"><h3>Berita terbaru</h3><div class="list">${POSTS.filter(p=>p.type==='berita').map(postRow).join('')}</div></div>`;
  }
  const paid = KK.filter(k=>PAY[k.id][nowIdx]===2).length;
  const jiwa = KK.reduce((a,k)=>a+k.members.length,0);
  return `
  <div class="grid g4" style="margin-bottom:16px">
    <div class="card stat"><div class="l">Kepala keluarga</div><div class="v">${KK.length}</div><div class="small muted">${jiwa} jiwa</div></div>
    <div class="card stat"><div class="l">Lunas ${MONTHS[nowIdx]}</div><div class="v">${paid}/${KK.length}</div><div class="small muted">${Math.round(paid/KK.length*100)}% kepatuhan</div></div>
    <div class="card stat"><div class="l">Pemasukan ${MONTHS[nowIdx]}</div><div class="v" style="font-size:22px">${rp(paid*FEE)}</div><div class="small muted">target ${rp(KK.length*FEE)}</div></div>
    <div class="card stat"><div class="l">Perlu tindakan</div><div class="v">${PROOFS.length+1}</div><div class="small muted">${PROOFS.length} bukti · 1 data</div></div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="row between"><h3>Bukti bayar menunggu verifikasi</h3><button class="btn sm" data-act="tabVerif">Semua</button></div>
      <div class="list">${PROOFS.length?PROOFS.map(proofRow).join(''):'<p class="muted">Tidak ada bukti yang menunggu. 🎉</p>'}</div></div>
    <div class="card"><h3>Pengajuan perubahan data</h3>
      <div class="item"><div class="avatar">RM</div><div class="grow"><b>Rina Marlina</b><div class="small muted">No. HP & anggota keluarga baru</div></div><button class="btn sm" data-act="review">Tinjau</button></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Tunggakan terbanyak</h3><div class="list">
    ${KK.map(k=>[k,PAY[k.id].filter(s=>s===0).length]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="item"><div class="avatar">${ini(k.head)}</div><div class="grow"><b>${k.head}</b><div class="small muted">Blok ${k.block}-${k.no}</div></div><span class="badge b-bad">${n} bln · ${rp(n*FEE)}</span></div>`).join('')}
  </div></div>`;
}
function proofRow(p){
  const k = kk(p.kk);
  return `<div class="item"><div class="avatar">${ini(k.head)}</div><div class="grow"><b>${k.head}</b>
  <div class="small muted">${p.months.map(m=>MONTHS[m]).join(', ')} · ${rp(p.amount)} · ${p.bank} · ${p.date}</div></div>
  <button class="btn sm" data-act="proof" data-id="${p.id}">Lihat</button></div>`;
}
function postRow(p){
  return `<div class="item"><div style="font-size:22px">${p.emoji}</div><div class="grow"><b>${p.title}</b><div class="small muted">${p.date}</div></div></div>`;
}
function pageWarga(){
  const q = S.q.toLowerCase();
  const rows = KK.filter(k => !q || (k.head+k.block+k.no+k.members.map(m=>m[0]).join(' ')).toLowerCase().includes(q));
  return `
  <div class="row" style="margin-bottom:16px;gap:10px">
    <input class="input" id="q" placeholder="Cari nama, blok, atau no. rumah…" value="${S.q}">
    <button class="btn pri hide-m" data-act="addKK">+ Tambah KK</button>
  </div>
  <div class="card table-d"><table><thead><tr><th>Kepala keluarga</th><th>Alamat</th><th>Status hunian</th><th>Jiwa</th><th>No. HP</th><th>Iuran ${MONTHS.at(-1)}</th></tr></thead><tbody>
    ${rows.map(k=>`<tr class="click" data-act="kk" data-id="${k.id}"><td><div class="row"><div class="avatar">${ini(k.head)}</div><b>${k.head}</b></div></td><td>Blok ${k.block} No. ${k.no}</td><td>${k.occ}</td><td>${k.members.length}</td><td>${k.phone}</td><td><span class="badge ${STAT[PAY[k.id].at(-1)][3]}">${STAT[PAY[k.id].at(-1)][2]}</span></td></tr>`).join('')}
  </tbody></table></div>
  <div class="cards-m">${rows.map(k=>`<div class="card" style="margin-bottom:10px;cursor:pointer" data-act="kk" data-id="${k.id}"><div class="row"><div class="avatar">${ini(k.head)}</div><div class="grow"><b>${k.head}</b><div class="small muted">Blok ${k.block}-${k.no} · ${k.occ} · ${k.members.length} jiwa</div></div><span class="badge ${STAT[PAY[k.id].at(-1)][3]}">${STAT[PAY[k.id].at(-1)][2]}</span></div></div>`).join('')}</div>`;
}
function kkDetail(k, own){
  return `
  <div class="card" style="margin-bottom:16px"><div class="row"><div class="avatar" style="width:52px;height:52px;font-size:18px">${ini(k.head)}</div>
    <div class="grow"><div style="font-size:18px;font-weight:700">${k.head}</div><div class="muted small">Blok ${k.block} No. ${k.no} · ${k.occ}</div></div></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;margin-top:14px;gap:10px">
      <div><div class="small muted">No. KK</div><b>3201••••••••00${k.id}2</b></div>
      <div><div class="small muted">No. HP</div><b>${k.phone}</b></div>
    </div></div>
  <div class="card"><div class="row between"><h3>Anggota keluarga (${k.members.length})</h3>${own?'<button class="btn sm pri" data-act="change">Ajukan perubahan</button>':''}</div><div class="list">
    ${k.members.map(m=>`<div class="item"><div class="avatar">${ini(m[0])}</div><div class="grow"><b>${m[0]}</b><div class="small muted">${m[1]} · ${m[2]==='L'?'Laki-laki':'Perempuan'} · ${m[3]} th</div></div></div>`).join('')}
  </div></div>`;
}
function pageSaya(){
  return kkDetail(kk(ME), true) + `<div class="card" style="margin-top:16px"><h3>Riwayat pengajuan</h3>
  <div class="item"><div class="grow"><b>Ubah no. HP</b><div class="small muted">12 Okt 2026</div></div><span class="badge b-ok">Disetujui</span></div></div>`;
}
function pageIuran(){
  const tabs = [['rekap','Rekap'],['riwayat', isStaff()?'Per warga':'Iuran saya']];
  if (isStaff()) tabs.push(['verif',`Verifikasi (${PROOFS.length})`],['catat','Catat bayar']);
  else tabs.push(['upload','Unggah bukti']);
  if (!tabs.find(t=>t[0]===S.iuranTab)) S.iuranTab='rekap';
  let body='';
  if (S.iuranTab==='rekap'){
    const totals = MONTHS.map((_,i)=>KK.filter(k=>PAY[k.id][i]===2).length);
    body = `<div class="card"><div class="row between" style="flex-wrap:wrap;gap:8px"><h3>Rekap iuran 2026</h3>
      <div class="small row" style="gap:10px"><span><span class="dot d-ok">✓</span> Lunas</span><span><span class="dot d-warn">⏳</span> Menunggu</span><span><span class="dot d-bad">✕</span> Belum</span></div></div>
      ${!isStaff()?'<p class="small muted" style="margin-top:0">Tampilan untuk warga hanya menampilkan nama kepala keluarga, alamat, dan status bayar.</p>':''}
      <div class="scroll-x"><table class="matrix"><thead><tr><th>Rumah</th>${MONTHS.map(m=>`<th>${m}</th>`).join('')}${isStaff()?'<th>Tunggakan</th>':''}</tr></thead><tbody>
      ${KK.map(k=>`<tr${isStaff()?` class="click" data-act="pickKK" data-id="${k.id}"`:''}><td><b>${k.block}-${k.no}</b> <span class="small muted">${k.head}</span></td>${PAY[k.id].map(s=>`<td><span class="dot ${STAT[s][0]}">${STAT[s][1]}</span></td>`).join('')}${isStaff()?`<td>${(c=>c?`<span class="badge b-bad">${rp(c*FEE)}</span>`:'—')(PAY[k.id].filter(s=>s===0).length)}</td>`:''}</tr>`).join('')}
      </tbody>${isStaff()?`<tfoot><tr><td><b>Pemasukan</b></td>${totals.map(t=>`<td class="small"><b>${(t*FEE/1000)}rb</b></td>`).join('')}<td></td></tr></tfoot>`:''}</table></div></div>`;
  }
  if (S.iuranTab==='riwayat'){
    const id = isStaff()? S.kkPick : ME, k = kk(id);
    const arrears = PAY[id].filter(s=>s===0).length;
    body = `${isStaff()?`<select class="input" id="pick" style="margin-bottom:16px">${KK.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.block}-${x.no} · ${x.head}</option>`).join('')}</select>`:''}
    <div class="grid g4" style="margin-bottom:16px">
      <div class="card stat"><div class="l">Dibayar 2026</div><div class="v" style="font-size:20px">${rp(PAY[id].filter(s=>s===2).length*FEE)}</div></div>
      <div class="card stat"><div class="l">Tunggakan</div><div class="v" style="font-size:20px;color:${arrears?'var(--bad)':'inherit'}">${rp(arrears*FEE)}</div></div>
    </div>
    <div class="card"><h3>Riwayat ${k.head}</h3><div class="list">
      ${PAY[id].map((s,i)=>[s,i]).reverse().map(([s,i])=>`<div class="item"><div class="dot ${STAT[s][0]}">${STAT[s][1]}</div><div class="grow"><b>${MONTHS[i]} 2026</b><div class="small muted">${rp(FEE)}${s===2?' · Transfer · dicatat Pengurus':''}</div></div><span class="badge ${STAT[s][3]}">${STAT[s][2]}</span></div>`).join('')}
    </div></div>`;
  }
  if (S.iuranTab==='verif') body = `<div class="card"><h3>Bukti bayar dari warga</h3><div class="list">${PROOFS.length?PROOFS.map(proofRow).join(''):'<p class="muted">Semua bukti sudah diverifikasi. 🎉</p>'}</div></div>`;
  if (S.iuranTab==='catat') body = `<div class="card" style="max-width:560px">${payForm(false)}</div>`;
  if (S.iuranTab==='upload') body = `<div class="card" style="max-width:560px">${payForm(true)}</div>`;
  return `<div class="tabs">${tabs.map(t=>`<button class="tab ${S.iuranTab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
}
function payForm(upload){
  const id = upload? ME : S.kkPick;
  const unpaid = PAY[id].map((s,i)=>[s,i]).filter(x=>x[0]===0);
  return `<h3>${upload?'Unggah bukti pembayaran':'Catat pembayaran'}</h3>
  ${upload?'':`<label class="f"><span>Kepala keluarga</span><select class="input" id="pick">${KK.map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${x.block}-${x.no} · ${x.head}</option>`).join('')}</select></label>`}
  <label class="f"><span>Bulan yang dibayar</span></label>
  <div class="chk" style="margin:-6px 0 14px">${unpaid.length?unpaid.map(([,i])=>`<label><input type="checkbox" checked> ${MONTHS[i]} 2026</label>`).join(''):'<span class="muted small">Tidak ada tunggakan.</span>'}</div>
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
    <label class="f"><span>Nominal</span><input class="input" value="${rp(Math.max(unpaid.length,1)*FEE)}"></label>
    <label class="f"><span>Metode</span><select class="input"><option>Transfer</option><option>QRIS</option>${upload?'':'<option>Tunai</option>'}</select></label>
  </div>
  ${upload?`<label class="f"><span>Foto / screenshot bukti</span><div class="drop">📷 Ketuk untuk ambil foto atau pilih file<br><span class="small">JPG, PNG, PDF · maks. 5 MB</span></div></label>`:''}
  <button class="btn pri" style="width:100%" data-act="${upload?'sendProof':'savePay'}">${upload?'Kirim bukti':'Simpan — tandai lunas'}</button>`;
}
function pageBerita(){
  return `${isStaff()?'<div class="row" style="justify-content:flex-end;margin-bottom:12px"><button class="btn pri hide-m" data-act="newPost">+ Buat posting</button></div>':''}
  <div class="grid" style="gap:12px">${POSTS.map((p,i)=>`<div class="card post" style="cursor:pointer" data-act="post" data-id="${i}">
    <div class="thumb" style="background:${p.type==='kegiatan'?'var(--primary-soft)':'var(--warn-soft)'}">${p.emoji}</div>
    <div class="grow" style="min-width:0"><div class="row" style="gap:6px;margin-bottom:4px"><span class="badge ${p.type==='kegiatan'?'b-pri':'b-warn'}">${p.type==='kegiatan'?'Kegiatan':'Berita'}</span>${p.pinned?'<span class="small muted">📌 Disematkan</span>':''}</div>
    <b>${p.title}</b><div class="small muted">${p.date}${p.place?' · '+p.place:''}</div>
    <div class="small hide-m" style="margin-top:4px">${p.body}</div></div></div>`).join('')}</div>`;
}
function pageAtur(){
  return `<div class="grid g2"><div class="card"><h3>Jenis iuran</h3><div class="list">
    ${[['Kebersihan',20000],['Keamanan',30000],['Kas Sosial',10000]].map(f=>`<div class="item"><div class="grow"><b>${f[0]}</b><div class="small muted">Bulanan</div></div><b>${rp(f[1])}</b></div>`).join('')}
    </div><button class="btn" style="margin-top:12px">+ Tambah jenis iuran</button></div>
    <div class="card"><h3>Pengguna & peran</h3><div class="list">
    ${[['Budi Santoso','Admin'],['Ahmad Fauzi','Pengurus (Ketua RT)'],['Dewi Lestari','Pengurus (Bendahara)']].map(u=>`<div class="item"><div class="avatar">${ini(u[0])}</div><div class="grow"><b>${u[0]}</b><div class="small muted">${u[1]}</div></div></div>`).join('')}
    </div><p class="small muted">${KK.length*3-3} akun warga lainnya</p></div></div>`;
}

/* ---------- Aksi ---------- */
const ACT = {
  upload(){ S.page='iuran'; S.iuranTab='upload'; render(); },
  tabVerif(){ S.page='iuran'; S.iuranTab='verif'; render(); },
  pickKK(id){ S.kkPick=+id; S.iuranTab='riwayat'; render(); },
  kk(id){ openModal(`<h2>Detail keluarga</h2>${kkDetail(kk(+id), false)}<button class="btn" style="width:100%;margin-top:14px" data-act="close">Tutup</button>`); },
  close: closeModal,
  proof(id){
    const p = PROOFS.find(x=>x.id==id), k = kk(p.kk);
    openModal(`<h2>Bukti bayar · ${k.head}</h2>
      <div class="drop" style="height:200px;display:grid;place-items:center;border-style:solid">🧾 Pratinjau gambar bukti transfer</div>
      <div class="list" style="margin:12px 0"><div class="item"><span class="grow muted">Bulan</span><b>${p.months.map(m=>MONTHS[m]).join(', ')} 2026</b></div>
      <div class="item"><span class="grow muted">Nominal</span><b>${rp(p.amount)}</b></div><div class="item"><span class="grow muted">Metode</span><b>${p.bank}</b></div><div class="item"><span class="grow muted">Tanggal</span><b>${p.date}</b></div></div>
      <label class="f"><span>Catatan (wajib jika ditolak)</span><input class="input" placeholder="mis. nominal tidak sesuai"></label>
      <div class="row" style="gap:8px"><button class="btn badb" style="flex:1" data-act="reject" data-id="${p.id}">Tolak</button><button class="btn pri" style="flex:2" data-act="approve" data-id="${p.id}">Terima — tandai lunas</button></div>`);
  },
  approve(id){ const p=PROOFS.find(x=>x.id==id); p.months.forEach(m=>PAY[p.kk][m]=2); PROOFS.splice(PROOFS.indexOf(p),1); closeModal(); render(); toast('Pembayaran diterima, warga mendapat notifikasi'); },
  reject(id){ const p=PROOFS.find(x=>x.id==id); p.months.forEach(m=>PAY[p.kk][m]=0); PROOFS.splice(PROOFS.indexOf(p),1); closeModal(); render(); toast('Bukti ditolak, warga mendapat notifikasi'); },
  savePay(){ PAY[S.kkPick]=PAY[S.kkPick].map(s=>s===0?2:s); render(); toast('Pembayaran dicatat sebagai lunas'); },
  sendProof(){ PAY[ME]=PAY[ME].map(s=>s===0?1:s); S.iuranTab='riwayat'; render(); toast('Bukti terkirim, menunggu verifikasi pengurus'); },
  change(){ closeModal(); openModal(`<h2>Ajukan perubahan data</h2>
    <label class="f"><span>No. HP</span><input class="input" value="081234564410"></label>
    <label class="f"><span>Pekerjaan</span><input class="input" value="Karyawan swasta"></label>
    <label class="f"><span>Nama / NIK / tanggal lahir</span><input class="input" placeholder="Isi jika ada koreksi"></label>
    <p class="small muted">No. HP & pekerjaan langsung tersimpan. Perubahan identitas (nama, NIK, No. KK, tanggal lahir) akan ditinjau pengurus terlebih dahulu.</p>
    <button class="btn pri" style="width:100%" data-act="sendChange">Kirim</button>`); },
  sendChange(){ closeModal(); toast('Pengajuan terkirim ke pengurus'); },
  review(){ openModal(`<h2>Tinjau perubahan · Rina Marlina</h2><table><thead><tr><th>Data</th><th>Lama</th><th>Baru</th></tr></thead><tbody>
    <tr><td>No. HP</td><td>0822•••5512</td><td><b>0822•••7788</b></td></tr><tr><td>Anggota</td><td>—</td><td><b>+ Bima Nugroho (Anak, 2 th)</b></td></tr></tbody></table>
    <div class="row" style="gap:8px;margin-top:16px"><button class="btn badb" style="flex:1" data-act="close">Tolak</button><button class="btn pri" style="flex:2" data-act="sendChange">Setujui</button></div>`); },
  addKK(){ openModal(`<h2>Tambah kepala keluarga</h2>
    <label class="f"><span>No. KK</span><input class="input" inputmode="numeric"></label>
    <label class="f"><span>Nama kepala keluarga</span><input class="input"></label>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px"><label class="f"><span>Blok</span><input class="input"></label><label class="f"><span>No. rumah</span><input class="input"></label></div>
    <label class="f"><span>Status hunian</span><select class="input"><option>Pemilik</option><option>Kontrak</option><option>Kos</option></select></label>
    <button class="btn pri" style="width:100%" data-act="close">Simpan & tambah anggota</button>`); },
  newPost(){ openModal(`<h2>Buat posting</h2>
    <div class="tabs"><button class="tab on">Berita</button><button class="tab">Kegiatan</button></div>
    <label class="f"><span>Judul</span><input class="input"></label>
    <label class="f"><span>Tanggal & jam kegiatan</span><input class="input" type="datetime-local"></label>
    <label class="f"><span>Isi</span><textarea class="input" rows="5"></textarea></label>
    <div class="drop" style="margin-bottom:14px">🖼️ Tambah gambar sampul</div>
    <div class="row" style="gap:8px"><button class="btn" style="flex:1" data-act="close">Simpan draf</button><button class="btn pri" style="flex:2" data-act="publish">Terbitkan</button></div>`); },
  publish(){ closeModal(); toast('Posting diterbitkan, warga mendapat notifikasi'); },
  post(i){ const p=POSTS[i]; openModal(`<div class="thumb" style="width:100%;height:140px;background:var(--primary-soft);font-size:48px;margin-bottom:14px">${p.emoji}</div>
    <span class="badge ${p.type==='kegiatan'?'b-pri':'b-warn'}">${p.type==='kegiatan'?'Kegiatan':'Berita'}</span><h2 style="margin-top:8px">${p.title}</h2>
    <p class="small muted">${p.date}${p.place?'<br>📍 '+p.place:''}</p><p>${p.body}</p><button class="btn" style="width:100%" data-act="close">Tutup</button>`); },
};

/* ---------- Render ---------- */
const PAGES = {home:pageHome, warga:pageWarga, saya:pageSaya, iuran:pageIuran, berita:pageBerita, atur:pageAtur};
function render(){
  renderNav();
  $('#view').innerHTML = PAGES[S.page]();
  const fabAct = {warga:'addKK', berita:'newPost'}[S.page];
  const fab = $('#fab'); fab.style.visibility = (isStaff() && fabAct) ? 'visible' : 'hidden'; fab.dataset.act = fabAct || '';
  const q = $('#q'); if (q) q.addEventListener('input', e => { S.q = e.target.value; const pos=e.target.selectionStart; render(); const n=$('#q'); n.focus(); n.setSelectionRange(pos,pos); });
  const pick = $('#pick'); if (pick) pick.addEventListener('change', e => { S.kkPick = +e.target.value; render(); });
}
render();
</script>
</body>
</html>
